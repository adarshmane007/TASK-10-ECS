name: Blue/Green Deploy Strapi (Task 10)

on:
  workflow_dispatch:
  push:
    branches:
      - adarsh_mane
    paths:
      - '.github/workflows/task10.yml'
      - '.github/scripts/**'
      - 'ecs-strapi/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Docker (safe method for Ubuntu Noble)
        run: |
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push Docker image
        run: |
          IMAGE_URI="${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}"
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI

      - name: Trigger CodeDeploy Deployment
        run: |
          chmod +x .github/scripts/deploy.sh
          .github/scripts/deploy.sh

      - name: Monitor CodeDeploy Deployment Status
        run: |
          echo "Waiting for deployment to complete..."
          DEPLOYMENT_ID=$(aws deploy list-deployments \
            --application-name strapi-codedeploy-app \
            --deployment-group-name strapi-bluegreen-group \
            --query "deployments[0]" --output text)
          for i in {1..30}; do
            STATUS=$(aws deploy get-deployment \
              --deployment-id $DEPLOYMENT_ID \
              --query "deploymentInfo.status" --output text)
            echo "Current status: $STATUS"
            if [ "$STATUS" == "Succeeded" ]; then
              echo "✅ Deployment succeeded."
              exit 0
            elif [ "$STATUS" == "Failed" ]; then
              echo "❌ Deployment failed. Consider triggering rollback or alerting team."
              exit 1
            fi
            sleep 10
          done
          echo "⚠️ Deployment timed out after waiting. Manual check recommended."
          exit 1
