name: Provision ECS Infra (Task 10 - Blue/Green)

on:
  push:
    branches:
      - adarsh_mane
    paths:
      - 'terraform-ecs-strapi-8/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install Docker (safe method for Ubuntu Noble)
      run: |
        curl -fsSL https://get.docker.com -o get-docker.sh
        sudo sh get-docker.sh

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build and push Docker image
      run: |
        IMAGE_URI="${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}"
        docker build -t $IMAGE_URI .
        docker push $IMAGE_URI

    - name: Update terraform.tfvars with new image tag
      run: |
        echo 'ecr_image_url = "${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}"' > terraform-ecs-strapi-8/terraform.tfvars

    - name: Clean Terraform cache
      run: rm -rf .terraform terraform.tfstate*
      working-directory: terraform-ecs-strapi-8

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.7

    - name: Terraform Init
      run: terraform init
      working-directory: terraform-ecs-strapi-8

    - name: Terraform Plan
      run: terraform plan
      working-directory: terraform-ecs-strapi-8

    - name: Terraform Apply
      run: terraform apply -auto-approve
      working-directory: terraform-ecs-strapi-8
